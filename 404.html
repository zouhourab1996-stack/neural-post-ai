<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading…</title>
</head>
<body>
<script>
(function () {
  var originalUrl = location.pathname + location.search + location.hash;
  var indexUrl = new URL('/index.html', location.origin);

  function saveOriginal() {
    try {
      sessionStorage.setItem('spa-original-url', originalUrl);
    } catch (_) {}
  }

  fetch(indexUrl.href, { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('index.html not found');
      return response.text();
    })
    .then(function (html) {
      if (!/<base\s/i.test(html)) {
        html = html.replace(/<head([^>]*)>/i, '<head$1><base href="/">');
      }
      saveOriginal();
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      saveOriginal();
      location.replace(indexUrl.href);
    });
})();
</script>
</body>
</html>
