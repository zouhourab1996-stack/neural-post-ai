<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Abstract golden astrology chart wheel with intersecting aspect lines">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080f1d"/>
    <stop offset=".52" stop-color="#14213a"/>
    <stop offset="1" stop-color="#070d19"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="48%" r="60%">
    <stop offset="0" stop-color="#293b59" stop-opacity=".9"/>
    <stop offset=".7" stop-color="#142139" stop-opacity=".35"/>
    <stop offset="1" stop-color="#101b2e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7e5ad"/>
    <stop offset=".48" stop-color="#c49b5c"/>
    <stop offset="1" stop-color="#f0d49a"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b1d0c6"/>
    <stop offset="1" stop-color="#648d8a"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c7b9df"/>
    <stop offset="1" stop-color="#77779d"/>
  </linearGradient>
  <radialGradient id="planet" cx="32%" cy="27%" r="80%">
    <stop offset="0" stop-color="#fff0c4"/>
    <stop offset=".44" stop-color="#bd9657"/>
    <stop offset="1" stop-color="#3d3030"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <pattern id="grain" width="96" height="96" patternUnits="userSpaceOnUse">
