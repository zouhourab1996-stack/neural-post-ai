    <circle cx="58" cy="39" r=".8" fill="#a7c1bf" opacity=".22"/>
    <circle cx="81" cy="12" r=".7" fill="#dbc58f" opacity=".19"/>
    <circle cx="29" cy="77" r=".9" fill="#dbc58f" opacity=".18"/>
  </pattern>
</defs>
