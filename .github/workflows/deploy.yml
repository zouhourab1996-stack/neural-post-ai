name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static site
        run: npm run build


      - name: Copy essential static assets to dist
        run: |
          cp public/manifest.json ./dist/manifest.json || true
          cp public/ads.txt ./dist/ads.txt || true
          cp public/googlec2dbc31ac222183d.html ./dist/googlec2dbc31ac222183d.html || true
          cp public/404.html ./dist/404.html || true
          cp public/favicon.ico ./dist/favicon.ico || true
          cp public/favicon.svg ./dist/favicon.svg || true
          cp public/logo.svg ./dist/logo.svg || true
          cp public/icon-192.png ./dist/icon-192.png || true
          cp public/icon-512.png ./dist/icon-512.png || true
          cp public/og-image.jpg ./dist/og-image.jpg || true

      - name: Validate SEO files before deployment
        run: |
          set -euo pipefail
          test -s ./dist/sitemap.xml
          test -s ./dist/robots.txt
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("./dist/sitemap.xml")
          root = ET.parse("./dist/sitemap.xml").getroot()
          assert root.tag.endswith("urlset"), root.tag
          urls = root.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url")
          assert urls, "Sitemap contains no URLs"
          for u in urls:
              loc = u.find("{http://www.sitemaps.org/schemas/sitemap/0.9}loc")
              assert loc is not None and loc.text and loc.text.startswith("https://prophetic.pw/"), loc.text if loc is not None else "missing loc"
          print("Sitemap XML valid:", len(urls), "URLs")
          PY
          python - <<'PY'
          import json, pathlib, re, sys
          checked = 0
          pattern = re.compile(r'<script type="application/ld\\+json">(.*?)</script>', re.I | re.S)
          for path in pathlib.Path("./dist").rglob("*.html"):
              html = path.read_text(encoding="utf-8")
              for match in pattern.finditer(html):
                  checked += 1
                  try:
                      json.loads(match.group(1).strip())
                  except Exception as exc:
                      print(f"Invalid JSON-LD in {path}: {exc}", file=sys.stderr)
                      raise SystemExit(1)
          print("JSON-LD blocks valid:", checked)
          PY
          grep -Fq "Sitemap: https://prophetic.pw/sitemap.xml" ./dist/robots.txt
          grep -Fq 'meta name="robots"' ./dist/index.html
          echo "robots.txt and sitemap.xml validation passed."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Submit fresh URLs to search engines ONLY after they are live,
      # otherwise Search Console inspects them and reports 404.
      - name: Submit new URLs to IndexNow (after they are live)
        run: |
          set -e
          KEY=b00319baec734ccb90683521e219f02f
          URLS=$(curl -fsSL https://prophetic.pw/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' \
            | sed 's#<loc>##; s#</loc>##' \
            | sort -u)
          LIVE=""
          for URL in $URLS; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            if [ "$CODE" = "200" ]; then
              LIVE="$LIVE\"$URL\"," 
              echo "live: $URL"
            else
              echo "skipped (HTTP $CODE): $URL"
            fi
          done
          if [ -z "$LIVE" ]; then echo "No new live URLs to submit."; exit 0; fi
          BODY="{\"host\":\"prophetic.pw\",\"key\":\"$KEY\",\"keyLocation\":\"https://prophetic.pw/$KEY.txt\",\"urlList\":[${LIVE%,}]}"
          for EP in https://www.bing.com/indexnow https://api.indexnow.org/indexnow; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$EP" \
              -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
            echo "IndexNow $EP -> HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
          done